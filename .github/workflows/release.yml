name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected version tag and update distribution repositories.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.26.11

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build_date: ${{ steps.version.outputs.build_date }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          tag=""
          version="0.0.0"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
              echo '::error::Release tags must be vMAJOR.MINOR or vMAJOR.MINOR.PATCH.'
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          elif [[ "$PUBLISH_REQUESTED" == true ]]; then
            echo '::error::Select an existing version tag to publish a release.'
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test and vet
    uses: ./.github/workflows/ci.yml

  build:
    name: Build macOS universal DMGs
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [test, metadata]
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
      # Matches the deployment target in build/darwin/Taskfile.yml and the
      # "macOS 13 or newer" support statement in the README.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0 -Wl,-no_warn_duplicate_libraries"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run icons
          npm run icons:check
          npm run build

      - name: Build universal macOS app
        shell: bash
        run: |
          mkdir -p "dist/Pinger.app/Contents/MacOS" "dist/Pinger.app/Contents/Resources"
          cp build/darwin/icons.icns "dist/Pinger.app/Contents/Resources/icons.icns"
          for arch in amd64 arm64; do
            clang_arch="$arch"
            if [ "$arch" = amd64 ]; then clang_arch=x86_64; fi
            CC="clang -arch $clang_arch" CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" go build \
              -tags "sqlite_fts5 goolm private_mac_apis" \
              -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA} -X main.BuildDate=${BUILD_DATE}" \
              -o "dist/pinger-${arch}" .
          done
          lipo -create dist/pinger-amd64 dist/pinger-arm64 \
            -output "dist/Pinger.app/Contents/MacOS/pinger"
          rm dist/pinger-amd64 dist/pinger-arm64
          lipo -info "dist/Pinger.app/Contents/MacOS/pinger"
          plist="dist/Pinger.app/Contents/Info.plist"
          cp build/darwin/Info.plist "$plist"
          /usr/bin/plutil -replace CFBundleShortVersionString -string "${VERSION}" "$plist"
          /usr/bin/plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" "$plist"
          /usr/bin/plutil -replace LSMinimumSystemVersion -string "${MACOSX_DEPLOYMENT_TARGET}" "$plist"
          /usr/bin/plutil -lint "$plist"
          test -n "$(/usr/bin/plutil -extract NSMicrophoneUsageDescription raw -o - "$plist")"
          test -n "$(/usr/bin/plutil -extract NSCameraUsageDescription raw -o - "$plist")"
          codesign --force --deep --sign - "dist/Pinger.app"
          codesign --verify --deep --strict "dist/Pinger.app"

      - name: Sign macOS app with Developer ID
        if: needs.metadata.outputs.tag != '' && vars.PINGER_SIGN_MACOS == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE:?Missing macOS signing certificate}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing macOS signing password}"
          : "${MACOS_SIGNING_IDENTITY:?Missing Developer ID Application identity}"
          work="$(mktemp -d)"
          keychain="$work/pinger.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$work/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$MACOS_SIGNING_IDENTITY" dist/Pinger.app
          codesign --verify --deep --strict dist/Pinger.app

      - name: Smoke-test packaged macOS startup
        timeout-minutes: 2
        shell: bash
        run: |
          dist/Pinger.app/Contents/MacOS/pinger --smoke-test | tee "$RUNNER_TEMP/pinger-smoke.log"
          grep -Fxq 'Pinger packaged startup smoke passed' "$RUNNER_TEMP/pinger-smoke.log"

      - name: Create macOS DMGs
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/Pinger-${VERSION}-macos-universal.dmg"
          workspace="$(mktemp -d)"
          work="$workspace/source"
          rw_dmg="$workspace/rw.dmg"
          mount_point="$workspace/mount"
          mkdir -p "$work" "$mount_point"
          cleanup() {
            hdiutil detach "$mount_point" -quiet >/dev/null 2>&1 || true
            rm -rf "$workspace"
          }
          trap cleanup EXIT

          # Signed app, /Applications symlink for drag-install, and the hidden volume icon.
          cp -R "dist/Pinger.app" "$work/"
          ln -s /Applications "$work/Applications"
          cp build/darwin/icons.icns "$work/.VolumeIcon.icns"
          SetFile -c icnC "$work/.VolumeIcon.icns"

          hdiutil create -volname "Pinger" -srcfolder "$work" -ov -format UDRW "$rw_dmg"
          hdiutil attach "$rw_dmg" -readwrite -noverify -noautoopen -nobrowse -mountpoint "$mount_point"
          SetFile -a C "$mount_point"
          hdiutil detach "$mount_point" -quiet
          hdiutil convert "$rw_dmg" -format UDZO -imagekey zlib-level=9 -o "$dmg"

          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -readonly -noautoopen -nobrowse -mountpoint "$mount_point" >/dev/null
          test -f "$mount_point/.VolumeIcon.icns"
          [[ "$(GetFileInfo -a "$mount_point")" == *C* ]]
          hdiutil detach "$mount_point" -quiet
          ls -lh dist/*.dmg

      - name: Notarize and staple macOS DMG
        if: needs.metadata.outputs.tag != '' && vars.PINGER_SIGN_MACOS == 'true'
        shell: bash
        env:
          NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          : "${NOTARY_API_KEY:?Missing notary API key}"
          : "${NOTARY_KEY_ID:?Missing notary key ID}"
          : "${NOTARY_ISSUER:?Missing notary issuer ID}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$NOTARY_API_KEY" | base64 -D > "$work/key.p8"
          dmg="dist/Pinger-${VERSION}-macos-universal.dmg"
          xcrun notarytool submit "$dmg" --key "$work/key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait --timeout 15m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-dmgs
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64 ZIPs
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [test, metadata]
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run icons
          npm run icons:check
          npm run build

      - name: Generate Windows application resources
        shell: pwsh
        run: |
          go run scripts/windows/generate-windows-resources.go `
            -arch amd64 `
            -icon build/windows/icon.ico `
            -manifest build/windows/pinger.exe.manifest `
            -out rsrc_windows_amd64.syso

      - name: Build Windows x64 binaries
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64
          GOOS: windows
          CC: gcc
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ldflags = "-s -w -H windowsgui -X main.Version=$env:VERSION -X main.Commit=$env:GITHUB_SHA -X main.BuildDate=$env:BUILD_DATE"
          go build -tags "sqlite_fts5 goolm" -trimpath -buildvcs=false "-ldflags=$ldflags" -o dist/pinger.exe .
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          Remove-Item rsrc_windows_amd64.syso

      - name: Sign Windows executable
        if: needs.metadata.outputs.tag != '' && vars.PINGER_SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Missing Windows signing credentials' }
          $certificateFile = Join-Path $env:RUNNER_TEMP 'pinger-sign.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificateFile -Password $password -CertStoreLocation Cert:\CurrentUser\My
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (!$certificate -or !$signTool) { throw 'Signing certificate or Windows SDK SignTool is unavailable' }
            & $signTool.FullName sign /sha1 $certificate.Thumbprint /s My /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 dist/pinger.exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
            & $signTool.FullName verify /pa /all dist/pinger.exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed' }
          } finally {
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey }
            Remove-Item $certificateFile -ErrorAction SilentlyContinue
          }

      - name: Package Windows executable
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath dist/pinger.exe -DestinationPath "dist/Pinger-$($env:VERSION)-windows-amd64.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Get-ChildItem dist/*.zip).FullName)
          try {
            if ($zip.Entries.Count -ne 1 -or $zip.Entries[0].FullName -ne "pinger.exe") {
              throw "Windows package must contain exactly pinger.exe"
            }
          } finally { $zip.Dispose() }

      - name: Verify Windows icon is embedded
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path dist/pinger.exe).Path)
          if ($null -eq $icon) { throw "dist/pinger.exe has no embedded icon" }
          Write-Host "Embedded icon size: $($icon.Width)x$($icon.Height)"

      - name: Smoke-test packaged Windows startup
        timeout-minutes: 2
        shell: pwsh
        run: |
          $package = (Get-ChildItem dist/*.zip).FullName
          $smokeDir = Join-Path $env:RUNNER_TEMP 'pinger-smoke'
          Expand-Archive -LiteralPath $package -DestinationPath $smokeDir
          $stdout = Join-Path $smokeDir 'stdout.log'
          $stderr = Join-Path $smokeDir 'stderr.log'
          $process = Start-Process -FilePath (Join-Path $smokeDir 'pinger.exe') -ArgumentList '--smoke-test' `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (!$process.WaitForExit(45000)) {
            $process.Kill($true)
            throw 'Packaged Windows startup timed out'
          }
          Get-Content $stdout, $stderr
          if ($process.ExitCode -ne 0 -or 'Pinger packaged startup smoke passed' -notin (Get-Content $stdout)) {
            throw 'Packaged Windows startup handshake failed'
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-zips
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux x64 deb and AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [test, metadata]
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo -n apt-get update -y
          sudo -n apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev libsqlite3-dev imagemagick libfuse2 xvfb xauth

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run icons
          npm run icons:check
          npm run build

      - name: Render application icons
        shell: bash
        run: |
          mkdir -p dist/icons
          for size in 16 24 32 48 64 128 256 512 1024; do
            cp "build/linux/icons/${size}x${size}/pinger.png" "dist/icons/${size}.png"
          done

      - name: Build Linux x64 binaries
        shell: bash
        env:
          CGO_ENABLED: 1
          GOARCH: amd64
          GOOS: linux
          CC: gcc
        run: |
          go build -tags "sqlite_fts5 goolm" -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA} -X main.BuildDate=${BUILD_DATE}" \
            -o dist/pinger .
          chmod 755 dist/pinger

      - name: Build DEB package
        shell: bash
        run: |
          stage="$(mktemp -d)/pinger"
          mkdir -p "$stage/DEBIAN" \
            "$stage/usr/bin" \
            "$stage/usr/share/applications" \
            "$stage/usr/share/icons/hicolor" \
            "$stage/usr/share/pixmaps" \
            "$stage/usr/share/doc/pinger"

          cat > "$stage/DEBIAN/control" <<EOF
          Package: pinger
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Pinger <pinger@localhost>
          Depends: libgtk-4-1, libwebkitgtk-6.0-4
          Description: Desktop client for gomuks -- a Matrix client
           Pinger is a desktop client for gomuks, a Matrix client with
           SQLite caching and media storage.
          EOF

          cp dist/pinger "$stage/usr/bin/pinger"
          chmod 755 "$stage/usr/bin/pinger"

          cat > "$stage/usr/share/applications/fi.mau.pinger.desktop" <<EOF
          [Desktop Entry]
          Name=Pinger
          Comment=Desktop client for gomuks -- a Matrix client
          Exec=pinger
          Icon=pinger
          StartupWMClass=fi.mau.pinger
          Type=Application
          Categories=Network;InstantMessaging;
          Terminal=false
          EOF

          for size in 16 24 32 48 64 128 256 512 1024; do
            dir="$stage/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dir"
            cp "dist/icons/${size}.png" "$dir/pinger.png"
          done
          cp dist/icons/1024.png "$stage/usr/share/pixmaps/pinger.png"

          cp README.md "$stage/usr/share/doc/pinger/"

          dpkg-deb --root-owner-group --build "$stage" \
            "dist/Pinger-${VERSION}-linux-amd64.deb"
          # Fail the build if the package does not carry the application icon.
          dpkg-deb -c "dist/Pinger-${VERSION}-linux-amd64.deb" \
            | grep 'usr/share/icons/hicolor/256x256/apps/pinger.png'
          ls -lh dist/*.deb

      - name: Build AppImage
        shell: bash
        run: |
          appdir="$(mktemp -d)/pinger.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor" "$appdir/usr/share/pixmaps"

          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          SELF="$(readlink -f "$0")"
          DIR="$(dirname "$SELF")"
          exec "$DIR/usr/bin/pinger" "$@"
          EOF
          chmod 755 "$appdir/AppRun"

          cp dist/pinger "$appdir/usr/bin/pinger"
          chmod 755 "$appdir/usr/bin/pinger"

          cat > "$appdir/fi.mau.pinger.desktop" <<EOF
          [Desktop Entry]
          Name=Pinger
          Comment=Desktop client for gomuks -- a Matrix client
          Exec=pinger
          Icon=pinger
          StartupWMClass=fi.mau.pinger
          Type=Application
          Categories=Network;InstantMessaging;
          Terminal=false
          EOF
          cp "$appdir/fi.mau.pinger.desktop" "$appdir/usr/share/applications/fi.mau.pinger.desktop"

          # AppStream metadata keeps appimagetool from warning about missing upstream metadata.
          mkdir -p "$appdir/usr/share/metainfo"
          cat > "$appdir/usr/share/metainfo/fi.mau.pinger.appdata.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>fi.mau.pinger</id>
            <name>Pinger</name>
            <summary>Desktop client for gomuks, a Matrix client</summary>
            <description>
              <p>Pinger is a desktop Matrix chat client built on gomuks.</p>
            </description>
            <url type="homepage">https://github.com/cataWalter/pinger</url>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>AGPL-3.0-or-later</project_license>
            <launchable type="desktop-id">fi.mau.pinger.desktop</launchable>
          </component>
          EOF

          for size in 16 24 32 48 64 128 256 512 1024; do
            dir="$appdir/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dir"
            cp "dist/icons/${size}.png" "$dir/pinger.png"
          done
          cp dist/icons/1024.png "$appdir/usr/share/pixmaps/pinger.png"
          cp dist/icons/1024.png "$appdir/pinger.png"

          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage" \
            -o dist/appimagetool
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  dist/appimagetool" \
            | sha256sum --check --status
          chmod +x dist/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 dist/appimagetool "$appdir" \
            "dist/Pinger-${VERSION}-linux-amd64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/Pinger-${VERSION}-linux-amd64.AppImage" --appimage-version
          ls -lh dist/*.AppImage

      - name: Smoke-test packaged Linux startup
        timeout-minutes: 2
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          dpkg-deb --extract "dist/Pinger-${VERSION}-linux-amd64.deb" "$smoke_dir/deb"
          export XDG_CACHE_HOME="$smoke_dir/cache" XDG_CONFIG_HOME="$smoke_dir/config" XDG_DATA_HOME="$smoke_dir/data"
          # Ubuntu runners block the unprivileged user namespaces WebKitGTK's sandbox needs (bwrap: uid map denied).
          # This only affects the smoke test; the shipped app keeps the sandbox.
          export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          for executable in "$smoke_dir/deb/usr/bin/pinger" "dist/Pinger-${VERSION}-linux-amd64.AppImage"; do
            xvfb-run -a dbus-run-session -- "$executable" --smoke-test | tee "$smoke_dir/startup.log"
            grep -Fxq 'Pinger packaged startup smoke passed' "$smoke_dir/startup.log"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [metadata, build, build-windows, build-linux]
    if: needs.metadata.outputs.tag != '' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          node scripts/release/release-assets.mjs checksums dist
          node scripts/release/release-assets.mjs verify dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*

      - name: Publish release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/checksums.txt

  update-tap:
    name: Update Homebrew cask
    needs: [publish]
    uses: ./.github/workflows/update-tap.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      dry_run: false
    secrets: inherit

  update-apt:
    name: Update APT repository
    needs: [publish]
    uses: ./.github/workflows/update-deb-repo.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      dry_run: false
    secrets: inherit

