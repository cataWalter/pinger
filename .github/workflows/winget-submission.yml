name: Submit to Windows Package Manager (Winget)

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to submit.
        required: true
        type: string
      dry_run:
        description: Validate manifests without opening a Microsoft PR.
        type: boolean
        default: true
    secrets:
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate or submit.
        required: true
        type: string
      dry_run:
        description: Validate manifests without opening a Microsoft PR.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: winget-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  winget-pr:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check publication credentials
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: test -n "$GH_TOKEN" || { echo "::error::WINGET_TOKEN is required for submission."; exit 1; }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Download and verify Windows package
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-assets.mjs download windows "$RUNNER_TEMP/windows"

      - name: Install manifest validators
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends python3-jsonschema python3-yaml unzip

      - name: Generate and validate WinGet manifests
        env:
          VERSION: ${{ steps.asset.outputs.version }}
        run: |
          set -euo pipefail
          manifest_dir="winget-manifests/cataWalter/Pinger/$VERSION"
          node scripts/release-assets.mjs winget "$manifest_dir" "$RUNNER_TEMP/windows/release-asset.json"
          mkdir -p "$RUNNER_TEMP/winget-schemas"
          schema_root="https://raw.githubusercontent.com/microsoft/winget-cli/c608376673762a10971e6bf2cbeedb6b6a7cae88/schemas/JSON/manifests/v1.6.0"
          for kind in version defaultLocale installer; do
            curl --fail --location --retry 3 "$schema_root/manifest.$kind.1.6.0.json" -o "$RUNNER_TEMP/winget-schemas/$kind.json"
          done
          /usr/bin/python3 - "$manifest_dir" "$RUNNER_TEMP/winget-schemas" <<'PY'
          import json
          import pathlib
          import sys
          import jsonschema
          import yaml

          manifests = pathlib.Path(sys.argv[1])
          schemas = pathlib.Path(sys.argv[2])
          for filename in sorted(manifests.glob("*.yaml")):
              manifest = json.loads(filename.read_text())
              schema = json.loads((schemas / (manifest["ManifestType"] + ".json")).read_text())
              jsonschema.Draft7Validator(schema).validate(manifest)
              filename.write_text(yaml.safe_dump(manifest, sort_keys=False, allow_unicode=False))
              print("Validated " + filename.name)
          PY
          echo "Validated all three WinGet manifests and the Windows ZIP checksum for $TAG." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: winget-manifests-${{ github.run_id }}
          path: winget-manifests/
          if-no-files-found: error
          retention-days: 7

      - name: Submit or update the WinGet PR
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.asset.outputs.version }}
        run: |
          set -euo pipefail
          gh_user="$(gh api user --jq .login)"
          manifest_dir="manifests/c/cataWalter/Pinger/$VERSION"
          branch="pinger-$VERSION"
          if gh api "repos/microsoft/winget-pkgs/contents/$manifest_dir" >/dev/null 2>&1; then
            echo "Version $VERSION is already present in WinGet."
            exit 0
          fi
          if ! gh repo view "$gh_user/winget-pkgs" >/dev/null 2>&1; then
            gh repo fork microsoft/winget-pkgs --clone=false
          fi
          gh auth setup-git
          git clone --depth 1 --filter=blob:none --no-checkout --single-branch --branch master \
            https://github.com/microsoft/winget-pkgs.git winget-pkgs
          cd winget-pkgs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base="$(git rev-parse HEAD)"
          git read-tree "$base"
          manifest_source="../winget-manifests/cataWalter/Pinger/$VERSION"
          for file in "$manifest_source"/*.yaml; do
            path="$manifest_dir/$(basename "$file")"
            blob="$(git hash-object -w "$file")"
            git update-index --add --cacheinfo "100644,$blob,$path"
          done
          tree="$(git write-tree)"
          commit="$(printf 'New package: cataWalter.Pinger version %s\n' "$VERSION" | git commit-tree "$tree" -p "$base")"
          expected_paths="$(printf '%s\n' \
            "$manifest_dir/cataWalter.Pinger.installer.yaml" \
            "$manifest_dir/cataWalter.Pinger.locale.en-US.yaml" \
            "$manifest_dir/cataWalter.Pinger.yaml" | sort)"
          actual_paths="$(git diff-tree --no-commit-id --name-only -r "$commit" | sort)"
          if [[ "$actual_paths" != "$expected_paths" ]]; then
            echo "::error::WinGet commit must add only the three Pinger manifests."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_paths" "$actual_paths"
            exit 1
          fi
          git remote add fork "https://github.com/$gh_user/winget-pkgs.git"
          existing="$(git ls-remote fork "refs/heads/$branch" | cut -f1)"
          if [[ -n "$existing" ]]; then
            git push --force-with-lease="refs/heads/$branch:$existing" fork "$commit:refs/heads/$branch"
          else
            git push fork "$commit:refs/heads/$branch"
          fi
          count="$(gh pr list --repo microsoft/winget-pkgs --head "$gh_user:$branch" --base master --state open --json number --jq 'length')"
          if [[ "$count" == "0" ]]; then
            gh pr create --repo microsoft/winget-pkgs --head "$gh_user:$branch" --base master \
              --title "New package: cataWalter.Pinger version $VERSION" \
              --body "Verified release $TAG from https://github.com/$GITHUB_REPOSITORY. Includes validated nested-portable ZIP manifests."
          else
            echo "A WinGet PR already exists for $VERSION; its branch has been updated."
          fi
