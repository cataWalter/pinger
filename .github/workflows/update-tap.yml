name: Update Homebrew Tap

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish in the cask (e.g. v0.1.8)
        required: true
        type: string
      dry_run:
        description: Validate the cask without pushing to the tap.
        type: boolean
        default: true
    secrets:
      TAP_GITHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish in the cask (e.g. v0.1.8)
        required: true
        type: string
      dry_run:
        description: Validate the cask without pushing to the tap.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update-cask:
    name: Update pinger cask
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check publication credentials
        if: '!inputs.dry_run'
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          test -n "$TAP_TOKEN" || { echo "::error::TAP_GITHUB_TOKEN is required for publication."; exit 1; }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Download and verify release DMG
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-assets.mjs download macos "$RUNNER_TEMP/dmg"

      - name: Check out homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ inputs.dry_run && github.token || secrets.TAP_GITHUB_TOKEN }}
          path: tap
          ref: main
          fetch-depth: 0

      - name: Write cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          ruby -r rubygems -e 'file = "tap/Casks/pinger.rb"; current = File.exist?(file) && File.read(file)[/version "([^"]+)"/, 1]; abort "Refusing to downgrade the tap" if current && Gem::Version.new(current) > Gem::Version.new(ENV.fetch("VERSION"))'
          mkdir -p tap/Casks
          cat > tap/Casks/pinger.rb <<CASK
          cask "pinger" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
            name "Pinger"
            desc "Triage-focused Matrix desktop client with local AI assistance"
            homepage "https://github.com/${REPO}"

            depends_on macos: ">= :monterey"

            app "Pinger.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-rd", "com.apple.quarantine", "#{appdir}/Pinger.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Application Support/gomuks-desktop",
              "~/Library/Caches/gomuks-desktop",
            ]
          end
          CASK
          ruby -c tap/Casks/pinger.rb
          {
            echo "### Homebrew validation"
            echo "Verified Pinger $VERSION ($SHA256) and generated a valid cask."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated cask
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: homebrew-cask-${{ github.run_id }}
          path: tap/Casks/pinger.rb
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push to homebrew-tap
        if: '!inputs.dry_run'
        working-directory: tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pinger.rb
          if git diff --staged --quiet; then
            echo "Cask already up to date for ${VERSION}."
            exit 0
          fi
          git commit -m "Update pinger cask to ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
