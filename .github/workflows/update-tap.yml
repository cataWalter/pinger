name: Update Homebrew Tap

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish in the cask (e.g. v0.1.8)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish in the cask (e.g. v0.1.8)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update-cask:
    name: Update pinger cask
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download DMG and compute SHA-256
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          asset="$(printf '%s\n' "$assets" | grep '\.dmg$' | head -n 1 || true)"
          if [ -z "$asset" ]; then
            echo "No DMG asset on release $TAG" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dmg"
          gh release download "$TAG" --repo "$REPO" --pattern "$asset" --dir "$RUNNER_TEMP/dmg" --clobber
          sha="$(sha256sum "$RUNNER_TEMP/dmg/$asset" | awk '{print $1}')"
          {
            echo "version=${TAG#v}"
            echo "asset=$asset"
            echo "sha256=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cat > tap/Casks/pinger.rb <<CASK
          cask "pinger" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
            name "Pinger"
            desc "Triage-focused Matrix desktop client with local AI assistance"
            homepage "https://github.com/${REPO}"

            depends_on macos: ">= :monterey"

            app "Pinger.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-rd", "com.apple.quarantine", "#{appdir}/Pinger.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Application Support/gomuks-desktop",
              "~/Library/Caches/gomuks-desktop",
            ]
          end
          CASK
          ruby -c tap/Casks/pinger.rb

      - name: Commit and push to homebrew-tap
        working-directory: tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pinger.rb
          if git diff --staged --quiet; then
            echo "Cask already up to date for ${VERSION}."
            exit 0
          fi
          git commit -m "Update pinger cask to ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
