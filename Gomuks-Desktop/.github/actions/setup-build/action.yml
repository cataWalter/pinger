name: Set up Pinger build dependencies
description: Installs Go, the Windows C toolchain, Node.js for release-asset tests, and Qt for the native client.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - name: Set up MinGW-w64
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-gcc
        path-type: inherit

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: "22"

    - name: Install Qt
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
      with:
        version: "6.8.3"
        arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}
        modules: qtmultimedia
        cache: true
