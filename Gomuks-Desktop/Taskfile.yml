version: '3'

env:
  GOTOOLCHAIN: go1.26.11

vars:
  EXTRA_TAGS: "sqlite_fts5,goolm"
  # Directory holding the Qt GUI. Multi-config generators (Visual Studio) nest it under the config name.
  QT_OUT_DIR: '{{if eq OS "windows"}}qt6/build/Release{{else}}qt6/build{{end}}'
  # Optional Qt install root (for example Homebrew's qt prefix). Auto-detected with Homebrew on macOS.
  QT_PREFIX:
    sh: '{{if eq OS "darwin"}}brew --prefix qt 2>/dev/null || true{{else}}echo{{end}}'

tasks:
  build:
    summary: Builds the Qt client and its Go backend
    cmds:
      - task: build:qt6

  package:go:
    summary: Builds the macOS app bundle (Qt GUI plus Go backend)
    platforms: [darwin]
    cmds:
      - sh scripts/macos/build-macos-app.sh

  run:
    summary: Builds and runs the Qt client
    deps:
      - task: build:qt6
    cmds:
      - '"{{.QT_OUT_DIR}}/pinger-qt{{exeExt}}"'

  dev:qt6:
    summary: Runs the Qt client with hot reload (rebuilds and restarts pinger-qt on Qt or Go source changes)
    platforms: [darwin, linux]
    cmds:
      - sh scripts/dev/qt6-dev.sh

  build:qt6:
    summary: Builds the native Qt 6 client (pinger-qt) and the Go backend (pinger) into the same folder
    deps:
      - task: generate:windows:resources
    cmds:
      - cmake -S qt6 -B qt6/build -DCMAKE_BUILD_TYPE=Release{{if .QT_PREFIX}} -DCMAKE_PREFIX_PATH="{{.QT_PREFIX}}"{{end}}
      - cmake --build qt6/build --config Release --target pinger-qt
      - go build -tags "{{.EXTRA_TAGS}}" -trimpath -buildvcs=false -o "{{.QT_OUT_DIR}}/pinger{{exeExt}}" .

  generate:windows:resources:
    summary: Embeds the native icon and application manifest in Windows builds
    platforms: [windows]
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
    sources:
      - build/windows/icon.ico
      - build/windows/pinger.exe.manifest
      - scripts/windows/generate-windows-resources.go
      - go.mod
    generates:
      - rsrc_windows_{{.ARCH}}.syso
    cmds:
      - go run scripts/windows/generate-windows-resources.go -arch {{.ARCH}} -icon build/windows/icon.ico -manifest build/windows/pinger.exe.manifest -out rsrc_windows_{{.ARCH}}.syso
